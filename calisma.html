async function open(raw){const k=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']);const z=await S.decrypt({name:'AES-GCM',iv:ub(C.iv)},k,ub(C.d));
const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}
async function unwrap(pw){const base=await S.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
for(const e of C.keys){try{const w=await S.deriveKey({name:'PBKDF2',salt:ub(e.s),iterations:C.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
return new Uint8Array(await S.decrypt({name:'AES-GCM',iv:ub(e.i)},w,ub(e.w)))}catch(_){}}return null}
const f=document.getElementById('f'),er=document.getElementById('er'),go=document.getElementById('go');
f.onsubmit=async ev=>{ev.preventDefault();go.disabled=true;er.textContent='Açılıyor…';const raw=await unwrap(document.getElementById('pw').value.trim());
if(!raw){er.textContent='Şifre hatalı';go.disabled=false;return}
if(document.getElementById('rm').checked)try{localStorage.setItem(LS,JSON.stringify({k:bu(raw),t:Date.now()+30*864e5}))}catch(_){}
try{await open(raw)}catch(e){er.textContent='Sayfa açılamadı: tarayıcınızı güncelleyin.';go.disabled=false}};
(async()=>{try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v&&v.t>Date.now()){await open(ub(v.k));return}}catch(_){try{localStorage.removeItem(LS)}catch(__){}}f.hidden=false})();
